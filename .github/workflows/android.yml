name: Android build
on:
  push:
    paths: ["android/**"]
  pull_request:
    paths: ["android/**"]
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew assembleDebug
        working-directory: android
