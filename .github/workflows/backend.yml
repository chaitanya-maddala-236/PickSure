name: Backend checks
on:
  push:
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
